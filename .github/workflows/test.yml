# Browser tests: opens ta_canvas.html over file:// in Chromium and checks undo, restore, exports and more.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: the Playwright version in package.json must support the runner OS (ubuntu-latest moved to 26.04,
    # which Playwright 1.56 does not). Move both together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
